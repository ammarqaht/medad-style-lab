<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="shared/logo/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="shared/logo/apple-touch-icon.png">
<title>مـــــداد · مختبر الأساليب</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  body {
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap {
    width: min(1360px, 100% - 32px);
    margin-inline: auto;
  }
  .head {
    display: grid;
    gap: 14px;
    padding-block: clamp(40px, 8vw, 96px) clamp(28px, 5vw, 56px);
    border-block-end: 1px solid var(--gray);
  }
  .head__brand {
    font-size: clamp(56px, 9vw, 112px);
    line-height: 1;
    color: var(--green-500);
  }
  .head__title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(26px, 3.4vw, 40px);
    line-height: 1.3;
  }
  .head__line {
    color: var(--ink-muted);
    font-size: clamp(16px, 1.4vw, 18px);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: clamp(18px, 2.4vw, 32px);
    padding-block: clamp(28px, 4vw, 56px) 96px;
  }
  .card {
    display: grid;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    scroll-margin-top: 24px;
  }
  .card__frame {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border-radius: 14px;
    background: var(--gray);
    box-shadow: 0 0 0 1px rgba(12, 23, 21, .08);
    transition: box-shadow .35s var(--ease-out), transform .35s var(--ease-out);
  }
  .card__frame iframe {
    position: absolute;
    inset-block-start: 0;
    inset-inline-start: 0;
    width: 1440px;
    height: 900px;
    border: 0;
    transform-origin: top right; /* RTL: anchor to the inline-start corner */
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s ease;
  }
  .card__frame iframe.is-ready { opacity: 1; }
  /* Static thumbnail: light and instant. The live page loads only on hover. */
  .card__thumb {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card:hover .card__frame,
  .card:focus-visible .card__frame {
    transform: translateY(-3px);
    box-shadow: 0 0 0 1px rgba(12, 23, 21, .1), 0 18px 40px -18px rgba(8, 58, 53, .35);
  }
  .card:focus-visible { outline: none; }
  .card:focus-visible .card__frame { box-shadow: 0 0 0 2px var(--green-600); }
  .card__meta {
    display: flex;
    align-items: baseline;
    gap: 10px;
    direction: ltr;
    justify-content: flex-end;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card__num {
    font-size: 13px;
    color: var(--green-600);
    font-variant-numeric: tabular-nums;
  }
  .card__name {
    font-size: 16px;
    font-weight: 600;
  }
  .card:target .card__frame { box-shadow: 0 0 0 2px var(--green-500); }
  @media (prefers-reduced-motion: reduce) {
    .card__frame { transition: box-shadow .2s ease; }
    .card:hover .card__frame { transform: none; }
  }
</style>
</head>
<body>
  <header class="wrap head">
    <h1 class="head__brand"><span class="brand-word" role="img" aria-label="مداد">مـــــداد</span></h1>
    <p class="head__title" data-copy="gallery.title"></p>
    <p class="head__line" data-copy="gallery.line"></p>
  </header>

  <main class="wrap grid" id="grid"></main>

<script src="shared/content.js"></script>
<script src="shared/styles-list.js"></script>
<script>
(function () {
  MEDAD.fill();
  var grid = document.getElementById("grid");

  MEDAD_STYLES.forEach(function (s) {
    var a = document.createElement("a");
    a.className = "card";
    a.id = "s" + s.n;
    a.href = "styles/" + s.slug + "/index.html";
    a.innerHTML =
      '<div class="card__frame" data-src="styles/' + s.slug + '/index.html">' +
        '<img class="card__thumb" src="shared/thumbs/' + s.slug + '.webp" alt="" width="720" height="450" loading="lazy" decoding="async">' +
      '</div>' +
      '<div class="card__meta"><span class="card__num">' + s.n + '</span><span class="card__name">' + s.name + "</span></div>";
    grid.appendChild(a);
  });

  /* Live preview on hover (mouse only): one iframe at a time, removed on leave,
     so the gallery never runs more than one page. */
  var canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (canHover && !reduce) {
    var live = null, timer = 0;
    function drop() {
      clearTimeout(timer);
      if (live) { live.remove(); live = null; }
    }
    document.querySelectorAll(".card").forEach(function (card) {
      var frame = card.querySelector(".card__frame");
      card.addEventListener("mouseenter", function () {
        drop();
        timer = setTimeout(function () {
          var f = document.createElement("iframe");
          f.tabIndex = -1;
          f.setAttribute("aria-hidden", "true");
          f.title = card.querySelector(".card__name").textContent;
          f.style.transform = "scale(" + frame.clientWidth / 1440 + ")";
          f.addEventListener("load", function () { f.classList.add("is-ready"); }, { once: true });
          f.src = frame.getAttribute("data-src");
          frame.appendChild(f);
          live = f;
        }, 350);
      });
      card.addEventListener("mouseleave", drop);
    });
  }

  // Returning from a style (#sNN) scrolls its card into view.
  if (location.hash) {
    var t = document.getElementById(location.hash.slice(1));
    if (t) t.scrollIntoView({ block: "center" });
  }
})();
</script>
</body>
</html>
