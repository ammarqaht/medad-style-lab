<!doctype html>
<html lang="ar" dir="rtl" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مـــــداد</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/switcher.css">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.className = "js";</script>
</head>
<body>

<header class="mast" id="mast">
  <a class="mast__mark" href="#top" aria-label="مداد"><span class="brand-word" aria-hidden="true">مـــــداد</span></a>
  <a class="mast__link line-link" href="#contact" data-copy="nav.cta"></a>
</header>

<main id="top">

  <!-- I. The unveiling --------------------------------------------- -->
  <section class="hero" id="hero">
    <span class="rule rule--v rule--vs" aria-hidden="true"></span>
    <span class="rule rule--v rule--ve" aria-hidden="true"></span>

    <div class="hero__stage">
      <span class="rule rule--h rule--top" aria-hidden="true"></span>
      <div class="unveil" id="unveil">
        <p class="lit hero__word" data-lit>
          <span class="lit__base brand-word" role="img" aria-label="مداد">مـــــداد</span>
          <span class="lit__glow brand-word" aria-hidden="true">مـــــداد</span>
        </p>
      </div>
      <span class="rule rule--h rule--bottom" aria-hidden="true"></span>
    </div>

  </section>

  <!-- II. The promise ---------------------------------------------- -->
  <section class="intro">
    <h1 class="hero__title" data-copy="hero.headline" data-wipe></h1>
    <p class="hero__line small" data-copy="hero.line" data-rise style="--d:.5s"></p>
    <div data-rise style="--d:.8s"><a class="line-link line-link--lg" href="#contact" data-copy="hero.cta"></a></div>
  </section>

  <!-- III. A statement ---------------------------------------------- -->
  <section class="about">
    <h2 class="about__title" data-copy="about.title" data-wipe></h2>
    <p class="about__text small" data-copy="about.text" data-rise style="--d:.4s"></p>
  </section>

  <!-- IV. Three lines --------------------------------------------- -->
  <section class="pillars">
    <article class="pillar" data-row>
      <h3 class="pillar__title" data-copy="pillars.0.title"></h3>
      <p class="pillar__text small" data-copy="pillars.0.text"></p>
    </article>
    <article class="pillar" data-row>
      <h3 class="pillar__title" data-copy="pillars.1.title"></h3>
      <p class="pillar__text small" data-copy="pillars.1.text"></p>
    </article>
    <article class="pillar" data-row>
      <h3 class="pillar__title" data-copy="pillars.2.title"></h3>
      <p class="pillar__text small" data-copy="pillars.2.text"></p>
    </article>
  </section>

  <!-- V. The invitation ------------------------------------------- -->
  <section class="closing" id="contact">
    <div class="closing__frame">
      <span class="rule rule--h rule--top" aria-hidden="true"></span>
      <div data-wipe>
        <h2 class="lit closing__title" data-lit>
          <span class="lit__base" data-copy="closing.headlineKashida"></span>
          <span class="lit__glow" aria-hidden="true" data-copy="closing.headlineKashida"></span>
        </h2>
      </div>
      <span class="rule rule--h rule--bottom" aria-hidden="true"></span>
    </div>
    <div data-rise style="--d:.6s"><a class="line-link line-link--lg" id="mailBtn" href="#" data-copy="closing.cta"></a></div>
  </section>
</main>

<footer class="foot" data-rise>
  <span class="foot__mark brand-word" role="img" aria-label="مداد">مـــــداد</span>
  <p class="foot__line small" data-copy="footer.line"></p>
  <a class="foot__mail line-link" id="mailLink" href="#" dir="ltr"></a>
  <p class="foot__copy small" data-copy="footer.copyright"></p>
</footer>

<script src="../../shared/content.js"></script>
<script src="../../shared/styles-list.js"></script>
<script src="../../shared/switcher.js"></script>
<script src="script.js"></script>
</body>
</html>
