        <h1 class="hero__title" data-copy="hero.headline" data-bleed></h1>
        <p class="hero__line" data-copy="hero.line" data-bleed style="--d:.5s"></p>
        <div data-bleed style="--d:1s">
          <a class="brush-btn" href="#contact"><span data-copy="hero.cta"></span></a>
        </div>
      </div>
      <div class="seal" data-bleed style="--d:2.6s" aria-hidden="true">
        <span class="seal__stone"></span>
        <span class="seal__word" data-copy="meta.title"></span>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="about">
    <h2 class="about__title" data-copy="about.title" data-bleed></h2>
    <div class="about__sheet" data-bleed style="--d:.4s">
      <p class="about__text" data-copy="about.text"></p>
    </div>
  </section>

  <!-- PILLARS: three stones, never in a row -->
  <section class="stones">
    <article class="stone stone--a" data-bleed tabindex="0">
      <span class="stone__glaze" aria-hidden="true"></span>
      <span class="stone__dab" aria-hidden="true"></span>
      <h3 class="stone__title" data-copy="pillars.0.title"></h3>
      <p class="stone__text" data-copy="pillars.0.text"></p>
    </article>
    <article class="stone stone--b" data-bleed style="--d:.35s" tabindex="0">
      <span class="stone__glaze" aria-hidden="true"></span>
      <span class="stone__dab" aria-hidden="true"></span>
      <h3 class="stone__title" data-copy="pillars.1.title"></h3>
      <p class="stone__text" data-copy="pillars.1.text"></p>
    </article>
    <article class="stone stone--c" data-bleed style="--d:.7s" tabindex="0">
      <span class="stone__glaze" aria-hidden="true"></span>
      <span class="stone__dab" aria-hidden="true"></span>
      <h3 class="stone__title" data-copy="pillars.2.title"></h3>
      <p class="stone__text" data-copy="pillars.2.text"></p>
    </article>
  </section>

  <!-- CLOSING -->
  <section class="closing" id="contact">
    <span class="closing__rule" aria-hidden="true"></span>
    <h2 class="closing__title" data-copy="closing.headlineKashida" data-bleed></h2>
    <div data-bleed style="--d:.6s">
      <a class="brush-btn brush-btn--deep" id="mailBtn" href="#"><span data-copy="closing.cta"></span></a>
    </div>
  </section>
</main>

<footer class="foot">
  <span class="foot__rule" aria-hidden="true"></span>
  <div class="foot__in">
    <img class="foot__logo" src="../../shared/logo/medad-mark-ink.png" alt="مداد" width="808" height="267">
    <p class="foot__line" data-copy="footer.line"></p>
    <a class="foot__mail" id="mailLink" href="#" dir="ltr"></a>
    <p class="foot__copy" data-copy="footer.copyright"></p>
  </div>
</footer>

<script src="../../shared/content.js"></script>
<script src="../../shared/styles-list.js"></script>
<script src="../../shared/switcher.js"></script>
<script src="script.js"></script>
</body>
</html>
