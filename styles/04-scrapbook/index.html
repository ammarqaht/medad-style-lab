      </div>
    </article>
    <article class="place card card--index" data-drop style="--rot:-1deg; --d:.24s">
      <span class="tape tape--deep" style="--tr:5deg; inset-block-start:-13px; inset-inline-start:38%;"><i></i></span>
      <div class="paper card__paper">
        <svg class="icon" viewBox="0 0 80 80" aria-hidden="true"><g filter="url(#ink)" fill="none" stroke="#000" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M26 12 H 54 V 30 a 14 14 0 0 1 -28 0 Z"/><path d="M26 18 H 16 a 9 9 0 0 0 10 14 M54 18 H 64 a 9 9 0 0 1 -10 14"/>
          <path d="M40 44 V 56 M28 66 H 52 M32 56 H 48 V 66"/></g></svg>
        <h3 class="card__title" data-copy="pillars.2.title"></h3>
        <p class="card__text" data-copy="pillars.2.text"></p>
      </div>
    </article>
  </section>

  <!-- CLOSING: a torn green sheet with cut-out words --------------------- -->
  <section class="closing" id="contact">
    <div class="place board" data-drop style="--rot:-1.2deg; --spin:5deg">
      <span class="tape tape--gray" style="--tr:-24deg; inset-block-start:-8px; inset-inline-start:-14px;"><i></i></span>
      <span class="tape tape--gray" style="--tr:22deg; inset-block-end:-8px; inset-inline-end:-14px;"><i></i></span>
      <div class="paper paper--fiber board__paper">
        <div class="paper__in"></div>
        <div class="board__body">
          <h2 class="cut cut--closing" data-copy="closing.headlineKashida" data-cut></h2>
          <div class="place cta-wrap cta-wrap--light" data-drop style="--rot:-2deg; --d:.35s">
            <a class="ticket ticket--light" id="mailBtn" href="#"><span data-copy="closing.cta"></span></a>
          </div>
        </div>
        <svg class="board__postmark" viewBox="0 0 120 120" aria-hidden="true">
          <g filter="url(#ink-light)" fill="none" stroke="#000">
            <circle cx="60" cy="60" r="52" stroke-width="5"/><circle cx="60" cy="60" r="40" stroke-width="2"/>
            <path d="M60 38 C 67 49, 74 58, 74 67 a 14 14 0 0 1 -28 0 C 46 58, 53 49, 60 38 Z" fill="#000" stroke="none"/>
          </g>
        </svg>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="place footer__strip" data-drop style="--rot:.6deg; --spin:-4deg">
    <div class="paper footer__paper">
      <svg class="footer__stamp" viewBox="0 0 440 210" role="img" aria-label="مداد"><g filter="url(#ink)"><use href="#stamp-logo"/></g></svg>
      <p class="footer__line" data-copy="footer.line"></p>
      <a class="footer__mail" id="mailLink" href="#" dir="ltr"></a>
      <p class="footer__copy" data-copy="footer.copyright"></p>
    </div>
  </div>
</footer>

<script src="../../shared/content.js"></script>
<script src="../../shared/styles-list.js"></script>
<script src="../../shared/switcher.js"></script>
<script src="script.js"></script>
</body>
</html>
