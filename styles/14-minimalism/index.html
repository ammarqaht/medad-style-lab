<!doctype html>
<html lang="ar" dir="rtl" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مـــــداد</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/switcher.css">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.className = "js";</script>
</head>
<body>

<main id="top">

  <!-- 1 · Hero: the logo, one headline, one call to action, one stroke -->
  <section class="hero" aria-labelledby="heroTitle">
    <div class="hero__brand">
      <a class="hero__logo" href="#top" aria-label="مداد">
        <img src="../../shared/logo/medad-mark-green.png" alt="" width="808" height="267">
      </a>
    </div>

    <div class="hero__body">
      <h1 class="hero__title" id="heroTitle" data-copy="hero.headline"></h1>
      <a class="cta hero__cta" href="#contact" data-copy="hero.cta"></a>
    </div>

    <!-- Signature: a single calligraphic ink stroke, drawn right to left.
         It owns its own row, so it never sits beside any Arabic text. -->
    <div class="stroke" aria-hidden="true">
      <svg class="stroke__svg" id="stroke" viewBox="0 0 1200 140" preserveAspectRatio="none" focusable="false">
        <defs>
          <mask id="s14-pen">
            <path class="stroke__pen" id="strokePen" d="" fill="none" stroke="#FFFFFF" pathLength="1"/>
          </mask>
        </defs>
        <path class="stroke__ink" id="strokeInk" d="" mask="url(#s14-pen)"/>
      </svg>
    </div>
  </section>

  <!-- 2 · One sentence -->
  <section class="plate plate--line">
    <div class="statement">
      <p class="line" data-copy="hero.line" data-fade></p>
    </div>
  </section>

  <!-- 3 · Who we are -->
  <section class="plate plate--about">
    <div class="about">
      <h2 class="about__title" data-copy="about.title" data-fade></h2>
      <p class="about__text" data-copy="about.text" data-fade style="--d:.35s"></p>
    </div>
  </section>

  <!-- 4 · Three lines -->
  <section class="plate plate--pillars">
    <ul class="pillars">
      <li class="pillar" data-fade>
        <h3 class="pillar__title" data-copy="pillars.0.title"></h3>
        <p class="pillar__text" data-copy="pillars.0.text"></p>
      </li>
      <li class="pillar" data-fade style="--d:.3s">
        <h3 class="pillar__title" data-copy="pillars.1.title"></h3>
        <p class="pillar__text" data-copy="pillars.1.text"></p>
      </li>
      <li class="pillar" data-fade style="--d:.6s">
        <h3 class="pillar__title" data-copy="pillars.2.title"></h3>
        <p class="pillar__text" data-copy="pillars.2.text"></p>
      </li>
    </ul>
  </section>

  <!-- 5 · Closing -->
  <section class="plate plate--closing" id="contact">
    <div class="closing">
      <h2 class="closing__title" data-copy="closing.headlineKashida" data-fade></h2>
      <a class="cta" id="mailBtn" href="#" data-copy="closing.cta" data-fade style="--d:.4s"></a>
    </div>
  </section>
</main>

<footer class="footer">
  <img class="footer__logo" src="../../shared/logo/medad-mark-ink.png" alt="مداد" width="808" height="267">
  <p class="footer__line" data-copy="footer.line"></p>
  <a class="footer__mail" id="mailLink" href="#" dir="ltr"></a>
  <p class="footer__copy" data-copy="footer.copyright"></p>
</footer>

<script src="../../shared/content.js"></script>
<script src="../../shared/styles-list.js"></script>
<script src="../../shared/switcher.js"></script>
<script src="script.js"></script>
</body>
</html>
