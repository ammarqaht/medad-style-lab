<!doctype html>
<html lang="ar" dir="rtl" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مـــــداد</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/switcher.css">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.className = "js";</script>
</head>
<body>

<header class="topbar">
  <a class="topbar__logo" href="#top" data-copy="meta.title"></a>
  <a class="btn btn--sm" href="#contact"><span data-copy="nav.cta"></span></a>
</header>

<main id="top">

  <!-- HERO: a neon tube sign on a wet wall, rain falling over the city -->
  <section class="hero" id="hero" data-loop>
    <div class="hero__wall" aria-hidden="true"></div>
    <svg class="city city--far" id="cityFar" aria-hidden="true" preserveAspectRatio="none"></svg>
    <svg class="city city--near" id="cityNear" aria-hidden="true" preserveAspectRatio="none"></svg>
    <div class="hero__ground" aria-hidden="true"></div>
    <canvas class="rain" id="rain" aria-hidden="true"></canvas>

    <div class="stage" id="stage">
      <div class="sign" id="sign" role="img" aria-label="مداد">
        <span class="sign__spill" aria-hidden="true"></span>
        <span class="sign__cable sign__cable--a" aria-hidden="true"></span>
        <span class="sign__cable sign__cable--b" aria-hidden="true"></span>
        <span class="sign__box" aria-hidden="true"></span>
        <svg class="sign__frame" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
          <rect x="1.2" y="2.4" width="97.6" height="35.2" rx="3.2" ry="8" vector-effect="non-scaling-stroke"/>
        </svg>
        <span class="sign__clip sign__clip--tl" aria-hidden="true"></span>
        <span class="sign__clip sign__clip--tr" aria-hidden="true"></span>
        <span class="sign__clip sign__clip--bl" aria-hidden="true"></span>
        <span class="sign__clip sign__clip--br" aria-hidden="true"></span>
        <span class="sign__word" aria-hidden="true">
          <span class="tube tube--glass" data-copy="meta.title"></span>
          <span class="tube tube--a" data-copy="meta.title"></span>
          <span class="tube tube--b" data-copy="meta.title"></span>
        </span>
      </div>
      <div class="reflect" aria-hidden="true">
        <span class="reflect__word" data-copy="meta.title"></span>
        <span class="reflect__smear"></span>
      </div>
    </div>

    <div class="hero__panel panel" data-on>
      <h1 class="hero__title glitch" data-copy="hero.headline"></h1>
      <p class="hero__line" data-copy="hero.line"></p>
      <a class="btn btn--lg" href="#contact"><span data-copy="hero.cta"></span></a>
    </div>
  </section>

  <div class="tape" aria-hidden="true"><div class="tape__band" data-loop></div></div>

  <!-- ABOUT -->
  <section class="about">
    <h2 class="about__title glitch" data-copy="about.title" data-on></h2>
    <div class="about__panel panel" data-on style="--d:.1s">
      <span class="about__tube" aria-hidden="true"></span>
      <p class="about__text" data-copy="about.text"></p>
    </div>
  </section>

  <!-- PILLARS: holographic panels over projector bases -->
  <section class="pillars" data-loop>
    <article class="holo" data-on style="--d:0s">
      <span class="holo__fx" aria-hidden="true"></span>
      <span class="holo__num" aria-hidden="true"></span>
      <h3 class="holo__title glitch" data-copy="pillars.0.title"></h3>
      <p class="holo__text" data-copy="pillars.0.text"></p>
      <span class="holo__base" aria-hidden="true"></span>
    </article>
    <article class="holo" data-on style="--d:.12s">
      <span class="holo__fx" aria-hidden="true"></span>
      <span class="holo__num" aria-hidden="true"></span>
      <h3 class="holo__title glitch" data-copy="pillars.1.title"></h3>
      <p class="holo__text" data-copy="pillars.1.text"></p>
      <span class="holo__base" aria-hidden="true"></span>
    </article>
    <article class="holo" data-on style="--d:.24s">
      <span class="holo__fx" aria-hidden="true"></span>
      <span class="holo__num" aria-hidden="true"></span>
      <h3 class="holo__title glitch" data-copy="pillars.2.title"></h3>
      <p class="holo__text" data-copy="pillars.2.text"></p>
      <span class="holo__base" aria-hidden="true"></span>
    </article>
  </section>

  <!-- CLOSING: a hazard-taped bulkhead -->
  <section class="closing" id="contact">
    <div class="bulkhead" data-on data-loop>
      <div class="bulkhead__in">
        <h2 class="closing__title glitch" data-copy="closing.headlineKashida"></h2>
        <a class="btn btn--lg" id="mailBtn" href="#"><span data-copy="closing.cta"></span></a>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <p class="footer__logo" data-copy="meta.title"></p>
  <p class="footer__line" data-copy="footer.line"></p>
  <a class="footer__mail" id="mailLink" href="#" dir="ltr"></a>
  <p class="footer__copy" data-copy="footer.copyright"></p>
</footer>

<script src="../../shared/content.js"></script>
<script src="../../shared/styles-list.js"></script>
<script src="../../shared/switcher.js"></script>
<script src="script.js"></script>
</body>
</html>
